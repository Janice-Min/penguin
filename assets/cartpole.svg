<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="'DM Sans','Helvetica Neue',Arial,sans-serif">
  <title>Cart-pole model used for the PID, LQR and PPO comparison</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#376c65"/>
    </marker>
    <marker id="ahPink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e3799d"/>
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#d6e2dc" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="720" height="400" rx="26" fill="#f5faf7"/>

  <!-- info card -->
  <g transform="translate(34 30)">
    <rect width="232" height="92" rx="14" fill="#fff" stroke="#dcece6"/>
    <text x="16" y="28" font-size="13" font-weight="700" fill="#203044">State  s = [x, ẋ, θ, dθ/dt]</text>
    <text x="16" y="50" font-size="12" fill="#5d7080">θ = 0 is upright · goal: x = 0, θ = 0</text>
    <text x="16" y="70" font-size="12" fill="#5d7080">Fail if |θ| &gt; 45° or |x| &gt; 2.4 m</text>
  </g>

  <!-- gravity -->
  <g>
    <line x1="640" y1="58" x2="640" y2="122" stroke="#376c65" stroke-width="3" marker-end="url(#ah)"/>
    <text x="652" y="98" font-size="16" font-style="italic" font-weight="700" fill="#376c65">g</text>
  </g>

  <!-- ground and track -->
  <rect x="44" y="322" width="632" height="16" fill="url(#hatch)"/>
  <line x1="44" y1="322" x2="676" y2="322" stroke="#9fb6ad" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f3a7bd">
    <rect x="76" y="296" width="8" height="26" rx="3"/>
    <rect x="636" y="296" width="8" height="26" rx="3"/>
  </g>
  <text x="80" y="290" font-size="11" font-weight="700" fill="#b9648a" text-anchor="middle">−2.4 m</text>
  <text x="640" y="290" font-size="11" font-weight="700" fill="#b9648a" text-anchor="middle">+2.4 m</text>

  <!-- x = 0 reference and displacement -->
  <line x1="350" y1="314" x2="350" y2="360" stroke="#9fb6ad" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="350" y="378" font-size="11" font-weight="700" fill="#718092" text-anchor="middle">x = 0</text>
  <line x1="352" y1="352" x2="407" y2="352" stroke="#376c65" stroke-width="2.5" marker-end="url(#ah)"/>
  <text x="380" y="372" font-size="14" font-style="italic" font-weight="700" fill="#376c65" text-anchor="middle">x</text>

  <!-- force -->
  <line x1="236" y1="276" x2="333" y2="276" stroke="#e3799d" stroke-width="4" stroke-linecap="round" marker-end="url(#ahPink)"/>
  <text x="270" y="262" font-size="16" font-style="italic" font-weight="700" fill="#e3799d" text-anchor="middle">F</text>
  <text x="270" y="300" font-size="11" font-weight="700" fill="#b9648a" text-anchor="middle">|F| ≤ 25 N</text>

  <!-- cart -->
  <g>
    <rect x="350" y="246" width="120" height="58" rx="15" fill="#d8f0e8" stroke="#376c65" stroke-width="3"/>
    <text x="410" y="281" font-size="13" font-weight="700" fill="#203044" text-anchor="middle">M = 1.0 kg</text>
    <circle cx="380" cy="311" r="11" fill="#203044"/>
    <circle cx="440" cy="311" r="11" fill="#203044"/>
    <circle cx="380" cy="311" r="3.5" fill="#f5faf7"/>
    <circle cx="440" cy="311" r="3.5" fill="#f5faf7"/>
  </g>

  <!-- vertical reference and angle -->
  <line x1="410" y1="246" x2="410" y2="66" stroke="#9fb6ad" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M410 172 A74 74 0 0 1 432.9 175.6" fill="none" stroke="#e3799d" stroke-width="2.5"/>
  <text x="416" y="160" font-size="16" font-style="italic" font-weight="700" fill="#e3799d">θ</text>

  <!-- pole (point mass at the tip) -->
  <line x1="410" y1="246" x2="462.5" y2="84.4" stroke="#203044" stroke-width="7" stroke-linecap="round"/>
  <circle cx="410" cy="246" r="7" fill="#fff" stroke="#203044" stroke-width="3"/>
  <circle cx="462.5" cy="84.4" r="17" fill="#ffc2d4" stroke="#e3799d" stroke-width="3"/>
  <text x="488" y="80" font-size="13" font-weight="700" fill="#203044">m = 0.2 kg</text>
  <text x="488" y="98" font-size="11" fill="#718092">point mass at the tip</text>
  <text transform="translate(455 178) rotate(-72)" font-size="13" font-weight="700" fill="#376c65" text-anchor="middle">l = 0.4 m</text>

  <!-- footer note -->
  <text x="686" y="378" font-size="11" fill="#718092" text-anchor="end">dt = 0.02 s · RK4 · 10 s per run</text>
</svg>
